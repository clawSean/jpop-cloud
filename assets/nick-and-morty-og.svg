<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Nick and Morty — a very well-named agent universe</title>
  <desc id="desc">A green portal surrounds the letters N and M on a dark background.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b9ff42" stop-opacity=".28"/>
      <stop offset=".58" stop-color="#35f39b" stop-opacity=".09"/>
      <stop offset="1" stop-color="#06100c" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#06100c"/>
  <circle cx="920" cy="315" r="300" fill="url(#glow)"/>
  <ellipse cx="915" cy="315" rx="245" ry="205" fill="none" stroke="#b9ff42" stroke-width="8" transform="rotate(-11 915 315)"/>
  <ellipse cx="915" cy="315" rx="205" ry="246" fill="none" stroke="#35f39b" stroke-opacity=".65" stroke-width="4" transform="rotate(24 915 315)"/>
  <ellipse cx="915" cy="315" rx="170" ry="220" fill="none" stroke="#62dfff" stroke-opacity=".48" stroke-width="2" stroke-dasharray="10 14" transform="rotate(-38 915 315)"/>
  <circle cx="915" cy="315" r="126" fill="#0c1914" stroke="#b9ff42" stroke-opacity=".42" stroke-width="2"/>
  <text x="915" y="346" text-anchor="middle" fill="#f3f6e9" font-family="Arial Black, sans-serif" font-size="104" font-weight="900" letter-spacing="-12">N×M</text>
  <text x="78" y="128" fill="#b9ff42" font-family="monospace" font-size="22" letter-spacing="4">A FRIENDLY TRANSMISSION FROM JPOP &amp; SEAN</text>
  <text x="72" y="282" fill="#f3f6e9" font-family="Arial Black, sans-serif" font-size="116" font-weight="900" letter-spacing="-7">NICK</text>
  <text x="78" y="382" fill="#b9ff42" font-family="monospace" font-size="55" font-weight="700">&amp;</text>
  <text x="72" y="502" fill="none" stroke="#f3f6e9" stroke-width="3" font-family="Arial Black, sans-serif" font-size="116" font-weight="900" letter-spacing="-7">MORTY.</text>
  <text x="80" y="572" fill="#9aab9e" font-family="monospace" font-size="23">THE JOKE IS EXCELLENT. THE ARCHITECTURE IS EVEN BETTER.</text>
  <circle cx="1115" cy="90" r="28" fill="#62dfff" opacity=".6" filter="url(#blur)"/>
</svg>
