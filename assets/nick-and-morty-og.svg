<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Nick and Morty — Interdimensional Cable</title>
  <desc id="desc">Nick, Morty, Summer, Beth, Jerry, Mr. Meeseeks, Birdperson, and the Citadel appear together in a neon system-map homage.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#b9ff42" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#35f39b" stop-opacity=".08"/>
      <stop offset="1" stop-color="#06100c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10201a"/>
      <stop offset="1" stop-color="#07110e"/>
    </linearGradient>
    <clipPath id="cast-clip"><rect x="536" y="82" width="620" height="466" rx="28"/></clipPath>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#ffffff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#06100c"/>
  <circle cx="910" cy="315" r="360" fill="url(#glow)"/>
  <path d="M510 40V590" stroke="#dfffe2" stroke-opacity=".13"/>
  <text x="64" y="90" fill="#b9ff42" font-family="monospace" font-size="18" letter-spacing="3">INTERDIMENSIONAL CABLE · N&amp;M-01</text>
  <text x="58" y="240" fill="#f3f6e9" font-family="Arial Black, sans-serif" font-size="112" font-weight="900" letter-spacing="-7">NICK</text>
  <text x="65" y="323" fill="#b9ff42" font-family="monospace" font-size="48" font-weight="700">&amp;</text>
  <text x="58" y="438" fill="none" stroke="#f3f6e9" stroke-width="3" font-family="Arial Black, sans-serif" font-size="104" font-weight="900" letter-spacing="-6">MORTY.</text>
  <text x="66" y="502" fill="#b9c8bd" font-family="Arial, sans-serif" font-size="26">THE WHOLE CAST. ONE SYSTEM.</text>
  <text x="66" y="551" fill="#788b7e" font-family="monospace" font-size="16">BUILT BY NICK · VISUAL HOMAGE BY JPOP &amp; SEAN</text>
  <rect x="526" y="72" width="640" height="486" rx="34" fill="url(#panel)" stroke="#b9ff42" stroke-opacity=".45" stroke-width="2"/>
  <image x="536" y="82" width="620" height="466" preserveAspectRatio="xMidYMid slice" xlink:href="nick-morty-cast-atlas-v2.avif" clip-path="url(#cast-clip)"/>
  <rect x="536" y="82" width="620" height="466" rx="28" fill="url(#scanlines)"/>
  <circle cx="1128" cy="100" r="7" fill="#b9ff42"/>
  <circle cx="1104" cy="100" r="7" fill="#62dfff"/>
  <circle cx="1080" cy="100" r="7" fill="#ff6060"/>
